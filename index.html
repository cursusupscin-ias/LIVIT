          const localOwnerUid = localStorage.getItem('livit_cloud_owner_uid');
          if (snap.exists() && snap.data().state) {
            // A returning account uses its cloud copy; local device data is not silently merged.
            applyCloudState(snap.data().state);
            localStorage.setItem('livit_cloud_owner_uid', user.uid);
          } else {
            // First sign-in imports this browser's data only when it is not owned by another account.
            const firstState = (!localOwnerUid || localOwnerUid === user.uid)
              ? JSON.parse(JSON.stringify(store.state))
              : store.getDefaultState();
            if (localOwnerUid && localOwnerUid !== user.uid) applyCloudState(firstState);
            await setDoc(ref, {
              state: firstState,
              schemaVersion: 1,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            });
            localStorage.setItem('livit_cloud_owner_uid', user.uid);
          }

          if (!cloudUser || cloudUser.uid !== user.uid) return;
          cloudReady = true;
          setCloudStatus('synced');

          let firstSnapshot = true;
          cloudUnsubscribe = onSnapshot(ref, snapshot => {
            if (!snapshot.exists() || !snapshot.data().state) return;
            const incoming = snapshot.data().state;
            const current = JSON.stringify(store.state);
            const next = JSON.stringify(incoming);
            if (firstSnapshot) {
              firstSnapshot = false;
              if (current !== next) applyCloudState(incoming);
              setCloudStatus('synced');
              return;
            }
            if (current !== next) applyCloudState(incoming);
            setCloudStatus('synced');
          }, err => {
            console.error('LIVIT cloud listener failed:', err);
            setCloudStatus('error');
          });
        } catch (err) {
          console.error('LIVIT cloud connection failed:', err);
          cloudReady = false;
          setCloudStatus('error');
          showToast('Could not connect to LIVIT cloud. Your local data is safe.');
        }
      }

      let googleSignInInProgress = false;
      let nativeAuthModulePromise = null;

      function getNativeAuthModule() {
        if (!nativeAuthModulePromise) {
          nativeAuthModulePromise = import('./native-auth.js');
        }
        return nativeAuthModulePromise;
      }

      function isGoogleSignInCancelled(error) {
        const details = `${error?.code || ''} ${error?.message || ''}`.toLowerCase();
        return details.includes('cancel') || details.includes('12501');
      }

      async function handleGoogleSignIn() {
        if (googleSignInInProgress) return;
        googleSignInInProgress = true;
        const button = document.getElementById('livit-google-signin');
        if (button) button.disabled = true;

        try {
          if (isNativePlatform) {
            // Android: use the native Credential Manager / Firebase flow.
            // The returned Google ID token is exchanged into this app's one
            // existing Firebase JavaScript Auth instance for Firestore sync.
            const nativeAuth = await getNativeAuthModule();
            const result = await nativeAuth.signInWithGoogle();
            const idToken = result?.credential?.idToken;
            if (!idToken) {
              throw new Error('Google did not return an ID token. Check the Android OAuth configuration.');
            }
            const credential = GoogleAuthProvider.credential(idToken);
            await signInWithCredential(auth, credential);
          } else {
            // Ordinary browsers retain the existing Firebase popup flow.
            await signInWithPopup(auth, googleProvider);
          }
        } catch (err) {
          console.error('Google sign-in failed:', err);
          if (isGoogleSignInCancelled(err)) {
            showToast('Google sign-in was cancelled.');
          } else if (err.code === 'auth/unauthorized-domain') {
            showToast('This website domain is not yet authorised in Firebase.');
          } else if (err.code === 'auth/popup-blocked') {
            showToast('Your browser blocked the sign-in popup. Allow popups and try again.');
          } else if (String(err?.message || '').includes('ID token')) {
            showToast('Google sign-in could not complete. Check the Android OAuth configuration.');
          } else {
            showToast('Google sign-in failed. Check your connection and Android Google sign-in configuration, then try again.');
          }
        } finally {
          googleSignInInProgress = false;
          if (button) button.disabled = false;
        }
      }

      async function handleSignOut() {
        try {
          if (isNativePlatform) {
            const nativeAuth = await getNativeAuthModule();
            // Clear both layers: the native Firebase session and the existing
            // Firebase JavaScript session used by Firestore.
            const results = await Promise.allSettled([
              signOut(auth),
              nativeAuth.signOut()
            ]);
            if (results.some(result => result.status === 'rejected')) {
              throw new Error('One authentication layer did not sign out.');
            }
          } else {
            await signOut(auth);
          }
          showToast('Signed out. Your local copy remains on this device.');
        } catch (err) {
          console.error('LIVIT sign-out failed:', err);
          showToast('Could not fully sign out. Please try again.');
        }
      }

      async function handleEmailSignIn(createAccount) {
        const email = document.getElementById('livit-auth-email')?.value.trim();
        const password = document.getElementById('livit-auth-password')?.value || '';
        if (!email || !password) {
          showToast('Enter your email address and password.');
          return;
        }
        if (password.length < 6) {
          showToast('Password must contain at least 6 characters.');
          return;
        }
        try {
          if (createAccount) {
            const credential = await createUserWithEmailAndPassword(auth, email, password);
            const displayName = email.split('@')[0].slice(0, 40);
            await updateProfile(credential.user, { displayName });
          } else {
            await signInWithEmailAndPassword(auth, email, password);
          }
        } catch (err) {
          console.error('Email authentication failed:', err);
          const messages = {
            'auth/email-already-in-use': 'An account already exists with this email. Sign in instead.',
            'auth/invalid-credential': 'Email or password is incorrect.',
            'auth/weak-password': 'Choose a stronger password (at least 6 characters).',
            'auth/invalid-email': 'Enter a valid email address.',
            'auth/unauthorized-domain': 'This website domain is not yet authorised in Firebase.'
          };
          showToast(messages[err.code] || ('Account action failed: ' + (err.message || err.code)));
        }
      }

      onAuthStateChanged(auth, async user => {
        if (!user) {
          if (cloudUnsubscribe) cloudUnsubscribe();
          cloudUnsubscribe = null;
          cloudUser = null;
          cloudReady = false;
          setCloudStatus('local');
        } else {
          await connectCloudUser(user);
        }
        if (uiState.activeSection === 'settings') renderActiveSection();
        updateCloudAccountHeader();
      });

      function updateCloudAccountHeader() {
        const el = document.getElementById('livit-cloud-account');
        if (!el) return;
        if (cloudUser) {
          el.innerHTML = `<div class="livit-account-line"><strong>${escapeHTML(cloudUser.displayName || cloudUser.email || 'LIVIT account')}</strong><span>${escapeHTML(cloudUser.email || '')}</span></div>`;
        } else {
          el.textContent = 'Not signed in · This device only';
        }
      }
      let currentTheme = getInitialTheme();
      applyTheme(currentTheme);

      const uiState = {
        activeSection: 'want', // 'want' | 'completed' | 'dropped' | 'categories' | 'settings'
        searchQuery: '',
        selectedCategoryId: 'all', // 'all' | 'uncategorised' | categoryId
        openMenuId: null,
        animate: true,
        refocusQuick: false,
        searchTimer: null,
        busy: new Set()
      };

      /* Close open card overflow menus on outside click */
      document.addEventListener('click', (e) => {
        if (uiState.openMenuId && !e.target.closest('.dropdown-wrap')) {
          uiState.openMenuId = null;
          renderActiveSection();
        }
      });

      /* Global Escape key handler for modals */
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeExperienceModal();
          closeConfirmModal();
          closeRenameCategoryModal();
          if (uiState.openMenuId) {
            uiState.openMenuId = null;
            renderActiveSection();
          }
        }
      });

      /* Theme Toggles */
      function toggleTheme() {
        const resolved = currentMode === 'auto' ? ((matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light') : currentMode;
        currentMode = resolved === 'dark' ? 'light' : 'dark';
        applyTheme(currentTheme);
        if (uiState.activeSection === 'settings') {
          renderActiveSection();
        }
      }

      document.getElementById('sidebar-theme-btn').addEventListener('click', toggleTheme);
      document.getElementById('mobile-theme-btn').addEventListener('click', toggleTheme);

      /* Navigation Binding */
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-nav');
          navigateTo(target);
        });
      });

      function navigateTo(section, preserveFilter = false) {
        uiState.activeSection = section;
        uiState.openMenuId = null;
        uiState.animate = true;
        if (!preserveFilter) {
          uiState.searchQuery = '';
          uiState.selectedCategoryId = 'all';
        }

        document.querySelectorAll('[data-nav]').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-nav') === section);
        });

        renderActiveSection();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      /* Update Sidebar Counts */
      function updateNavCounts() {
        const wantCount = store.state.experiences.filter(e => e.status === 'want').length;
        const compCount = store.state.experiences.filter(e => e.status === 'completed').length;
        const dropCount = store.state.experiences.filter(e => e.status === 'dropped').length;
        const catCount = store.state.categories.length;

        document.getElementById('nav-count-want').textContent = wantCount;
        document.getElementById('nav-count-completed').textContent = compCount;
        document.getElementById('nav-count-dropped').textContent = dropCount;
        document.getElementById('nav-count-categories').textContent = catCount;
      }

      /* Root Render Router */
      function renderApp() {
        const onboardingEl = document.getElementById('onboarding-view');
        const shellEl = document.getElementById('app-shell');

        if (!store.state.profile) {
          onboardingEl.classList.remove('hidden');
          shellEl.classList.add('hidden');
          setTimeout(() => document.getElementById('onboarding-name-input')?.focus(), 50);
          return;
        }

        onboardingEl.classList.add('hidden');
        shellEl.classList.remove('hidden');
        updateNavCounts();
        renderActiveSection();
      }

      /* Onboarding Form Handler */
      document.getElementById('onboarding-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('onboarding-name-input');
        const errorEl = document.getElementById('onboarding-error');
        const withSeeds = document.getElementById('onboarding-seed-checkbox').checked;
        const name = input.value.trim();

        if (!name) {
          errorEl.textContent = 'Please tell us what we should call you.';
          errorEl.classList.remove('hidden');
          input.focus();
          return;
        }

        errorEl.classList.add('hidden');
        store.setProfileName(name, withSeeds);
        uiState.activeSection = 'want';
        renderApp();
      });

      /* ----------------------------------------------------------------------
         SECTION RENDERERS
         ---------------------------------------------------------------------- */
      function renderActiveSection() {
        const container = document.getElementById('main-content');
        if (!container || !store.state.profile) return;

        switch (uiState.activeSection) {
          case 'want':
            renderExperiencesView(container, 'want');
            break;
          case 'completed':
            renderExperiencesView(container, 'completed');
            break;
          case 'dropped':
            renderExperiencesView(container, 'dropped');
            break;
          case 'categories':
            renderCategoriesView(container);
            break;
          case 'settings':
            renderSettingsView(container);
            break;
        }
      }

      function renderExperiencesView(container, status) {
        const userName = store.state.profile.name;
        const allForStatus = store.state.experiences.filter(e => e.status === status);

        // Apply search & category filter
        const query = uiState.searchQuery.trim().toLowerCase();
        const filtered = allForStatus.filter(exp => {
          const matchesCategory =
            uiState.selectedCategoryId === 'all' ||
            (uiState.selectedCategoryId === 'uncategorised' && !exp.categoryId) ||
            exp.categoryId === uiState.selectedCategoryId;

          if (!matchesCategory) return false;
          if (!query) return true;

          return (
            exp.title.toLowerCase().includes(query) ||
            exp.description.toLowerCase().includes(query) ||
            exp.location.toLowerCase().includes(query) ||
            exp.notes.toLowerCase().includes(query)
          );
        });

        if (status === 'completed') {
          filtered.sort((a, b) => String(b.completedAt || '').localeCompare(String(a.completedAt || '')));
        }

        const headerTitles = {
          want: {
            eyebrow: getTimeGreeting(userName),
            title: 'Want to Do',
            subtitle: 'Experiences waiting for their moment.'
          },
          completed: {
            eyebrow: 'Moments Lived',
            title: 'Completed',
            subtitle: 'The experiences you have turned into memories.'
          },
          dropped: {
            eyebrow: 'Set Aside',
            title: 'Dropped',
            subtitle: 'Experiences you chose not to pursue—always restorable.'
          }
        };

        const meta = headerTitles[status];
        const hasUncategorised = allForStatus.some(e => !e.categoryId);

        let html = `
          <header class="section-header">
            <div>
              <p class="greeting-eyebrow">${escapeHTML(meta.eyebrow)}</p>
              <h1 class="section-title">${escapeHTML(meta.title)}</h1>
              <p class="section-subtitle">${escapeHTML(meta.subtitle)}</p>
            </div>
            ${status === 'want' ? `
              <button type="button" id="header-add-exp-btn" class="btn btn-primary">
                <svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>Add Experience</span>
              </button>
            ` : ''}
          </header>
        `;

        // Inline Quick-Add Bar for Want to Do
        if (status === 'want') {
          html += `
            <form id="quick-add-form" class="quick-add-bar" autocomplete="off">
              <svg style="width:18px;height:18px;stroke:var(--ink-muted);fill:none;stroke-width:2;flex-shrink:0;" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <input
                type="text"
                id="quick-add-input"
                class="quick-add-input"
                placeholder="Add something you want to experience..."
                maxlength="140"
                aria-label="Quick add experience title"
              />
              <button type="submit" class="btn btn-secondary btn-sm">Quick Add</button>
            </form>
          `;
        }

        // Search & Category Filter Toolbar (shown whenever there are items or active filters)
        if (allForStatus.length > 0 || query || uiState.selectedCategoryId !== 'all') {
          html += `
            <div class="controls-toolbar">
              <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input
                  type="search"
                  id="exp-search-input"
                  class="input search-input"
                  placeholder="Search by title, location, description, or notes..."
                  value="${escapeHTML(uiState.searchQuery)}"
                  aria-label="Search experiences"
                />
                ${uiState.searchQuery ? `<button type="button" id="exp-search-clear" class="search-clear" aria-label="Clear search">✕</button>` : ''}
              </div>

              <div class="filter-pills-scroll" role="tablist" aria-label="Filter by category">
                <button type="button" class="filter-pill ${uiState.selectedCategoryId === 'all' ? 'active' : ''}" data-cat-filter="all">
                  All (${allForStatus.length})
                </button>
                ${store.state.categories.map(cat => {
                  const count = allForStatus.filter(e => e.categoryId === cat.id).length;
                  return `
                    <button type="button" class="filter-pill ${uiState.selectedCategoryId === cat.id ? 'active' : ''}" data-cat-filter="${escapeHTML(cat.id)}">
                      ${escapeHTML(cat.name)}${count > 0 ? ` (${count})` : ''}
                    </button>
                  `;
                }).join('')}
                ${hasUncategorised || uiState.selectedCategoryId === 'uncategorised' ? `
                  <button type="button" class="filter-pill ${uiState.selectedCategoryId === 'uncategorised' ? 'active' : ''}" data-cat-filter="uncategorised">
                    Uncategorised
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        }

        // Empty States vs Experience List
        if (allForStatus.length === 0) {
          html += renderEmptyStateForStatus(status);
        } else if (filtered.length === 0) {
          html += `
            <div class="empty-state">
              <h2 class="empty-state-title">No matching experiences</h2>
              <p class="empty-state-text">Try adjusting your search keywords or clearing the active category filter.</p>
              <button type="button" id="reset-filters-btn" class="btn btn-secondary">Clear Filters</button>
            </div>
          `;
        } else {
          html += `<div class="experience-list ${uiState.animate ? 'animate' : ''}">${filtered.map(exp => renderExperienceCard(exp)).join('')}</div>`;
        }

        container.innerHTML = html;
        uiState.animate = false;
        bindExperiencesViewEvents(container, status);
        if (uiState.refocusQuick) {
          uiState.refocusQuick = false;
          container.querySelector('#quick-add-input')?.focus();
        }
      }

      function renderEmptyStateForStatus(status) {
        const iconMarkup = `
          <svg class="empty-state-icon icon-for-light" aria-hidden="true"><use href="#livit-icon-light" /></svg>
          <svg class="empty-state-icon icon-for-dark" aria-hidden="true"><use href="#livit-icon-dark" /></svg>
        `;

        if (status === 'want') {
          return `
            <div class="empty-state">
              ${iconMarkup}
              <h2 class="empty-state-title">Your next great experience starts here.</h2>
              <p class="empty-state-text">Add something you've always wanted to do.</p>
              <button type="button" id="empty-add-exp-btn" class="btn btn-primary">Add Experience</button>
            </div>
          `;
        }

        if (status === 'completed') {
          return `
            <div class="empty-state">
              ${iconMarkup}
              <h2 class="empty-state-title">No completed experiences yet.</h2>
              <p class="empty-state-text">When you live out an experience from your Want to Do list, mark it completed to preserve the memory here.</p>
            </div>
          `;
        }

        return `
          <div class="empty-state">
            ${iconMarkup}
            <h2 class="empty-state-title">Nothing dropped.</h2>
            <p class="empty-state-text">Experiences you decide to set aside will appear here, and you can restore them anytime.</p>
          </div>
        `;
      }

      function renderExperienceCard(exp) {
        const category = exp.categoryId
          ? store.state.categories.find(c => c.id === exp.categoryId)
          : null;

        const badgeClass = category
          ? (category.tone === 'frost' ? 'badge-frost' : category.tone === 'sunrise' ? 'badge-sunrise' : 'badge-silver')
          : 'badge-silver';

        const categoryLabel = category ? category.name : 'Uncategorised';
        const isMenuOpen = uiState.openMenuId === exp.id;

        return `
          <article class="exp-card ${exp.status === 'dropped' ? 'is-dropped' : ''}" data-exp-id="${escapeHTML(exp.id)}">
            ${exp.status === 'want' ? `<button type="button" class="exp-check" style="--check-color:${category && category.color ? category.color : '#0EA5E9'}" data-action="complete" data-id="${escapeHTML(exp.id)}" aria-label="Mark completed"><svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg></button>` : exp.status === 'completed' ? `<button type="button" class="exp-check on" style="--check-color:${category && category.color ? category.color : '#0EA5E9'}" data-action="restore" data-id="${escapeHTML(exp.id)}" aria-label="Mark as not done"><svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg></button>` : ''}
            <div class="exp-card-body">
              <div class="exp-meta-top">
                <span class="category-badge ${badgeClass}" ${category && category.color ? `style="--cat-color:${category.color};background:color-mix(in srgb, ${category.color} 13%, var(--bg-surface));color:${category.color};border-color:color-mix(in srgb, ${category.color} 35%, transparent)"` : ''}>${escapeHTML(categoryLabel)}</span>
                ${exp.location ? `
                  <span class="exp-location">
                    <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span>${escapeHTML(exp.location)}</span>
                  </span>
                ` : ''}
                ${exp.status === 'completed' && exp.completedAt ? `
                  <span class="exp-date-meta">Completed ${escapeHTML(formatFriendlyDate(exp.completedAt))}</span>
                ` : ''}
              </div>

              <h3 class="exp-title">${escapeHTML(exp.title)}</h3>

              ${exp.description ? `<p class="exp-description">${escapeHTML(exp.description)}</p>` : ''}

              ${exp.notes ? `<div class="exp-notes-preview">${escapeHTML(exp.notes)}</div>` : ''}
            </div>

            <div class="exp-card-actions">
              ${exp.status === 'want' ? `
                <button type="button" class="btn-complete" data-action="complete" data-id="${escapeHTML(exp.id)}" title="Mark Completed">
                  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>Complete</span>
                </button>
              ` : `
                <button type="button" class="btn btn-secondary btn-sm" data-action="restore" data-id="${escapeHTML(exp.id)}">
                  Restore to Want to Do
                </button>
              `}

              <button type="button" class="btn btn-ghost btn-sm" data-action="edit" data-id="${escapeHTML(exp.id)}">
                Edit
              </button>

              <div class="dropdown-wrap">
                <button type="button" class="btn-icon" data-action="toggle-menu" data-id="${escapeHTML(exp.id)}" aria-label="More options" aria-expanded="${isMenuOpen}">
                  <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
                ${isMenuOpen ? `
                  <div class="dropdown-menu" role="menu">
                    ${exp.status === 'want' ? `
                      <button type="button" class="dropdown-item" role="menuitem" data-action="drop" data-id="${escapeHTML(exp.id)}">
                        Move to Dropped
                      </button>
                    ` : ''}
                    ${exp.status === 'dropped' ? `
                      <button type="button" class="dropdown-item" role="menuitem" data-action="complete-direct" data-id="${escapeHTML(exp.id)}">
                        Mark Completed
                      </button>
                    ` : ''}
                    <button type="button" class="dropdown-item danger" role="menuitem" data-action="delete" data-id="${escapeHTML(exp.id)}">
                      Delete Permanently
                    </button>
                  </div>
                ` : ''}
              </div>
            </div>
          </article>
        `;
      }

      function bindExperiencesViewEvents(container, status) {
        container.querySelector('#header-add-exp-btn')?.addEventListener('click', () => openExperienceModal());
        container.querySelector('#empty-add-exp-btn')?.addEventListener('click', () => openExperienceModal());

        // Quick-Add Form
        const quickForm = container.querySelector('#quick-add-form');
        if (quickForm) {
          quickForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const input = container.querySelector('#quick-add-input');
            const title = input.value.trim();
            if (!title) {
              input.focus();
              return;
            }
            const defaultCat = uiState.selectedCategoryId !== 'all' && uiState.selectedCategoryId !== 'uncategorised'
              ? uiState.selectedCategoryId
              : null;
            uiState.refocusQuick = true;
            store.addExperience({ title, categoryId: defaultCat });
            showToast('Added to Want to Do');
          });
        }

        // Search Input (preserve focus & cursor position)
        const searchInput = container.querySelector('#exp-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            uiState.searchQuery = e.target.value;
            clearTimeout(uiState.searchTimer);
            uiState.searchTimer = setTimeout(() => {
              const pos = uiState.searchQuery.length;
              renderActiveSection();
              const nextInput = document.getElementById('exp-search-input');
              if (nextInput) {
                nextInput.focus();
                nextInput.setSelectionRange(pos, pos);
              }
            }, 140);
          });
        }

        container.querySelector('#exp-search-clear')?.addEventListener('click', () => {
          uiState.searchQuery = '';
          renderActiveSection();
        });

        container.querySelector('#reset-filters-btn')?.addEventListener('click', () => {
          uiState.searchQuery = '';
          uiState.selectedCategoryId = 'all';
          renderActiveSection();
        });

        // Category Filter Pills
        container.querySelectorAll('[data-cat-filter]').forEach(pill => {
          pill.addEventListener('click', () => {
            uiState.selectedCategoryId = pill.getAttribute('data-cat-filter');
            uiState.animate = true;
            renderActiveSection();
          });
        });

        // Card Actions
        container.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const action = btn.getAttribute('data-action');
            const id = btn.getAttribute('data-id');
            const exp = store.state.experiences.find(item => item.id === id);
            if (!exp) return;

            if (action === 'complete') {
              if (uiState.busy.has(id)) return;
              uiState.busy.add(id);
              const card = container.querySelector(`.exp-card[data-exp-id="${CSS.escape(id)}"]`);
              if (card) card.classList.add('completing');
              const r = btn.getBoundingClientRect();
              celebrate(r.left + r.width / 2, r.top + r.height / 2);
              setTimeout(() => {
                uiState.busy.delete(id);
                store.updateExperience(id, { status: 'completed' });
                const all = store.state.experiences;
                const total = all.filter(e => e.status === 'completed').length;
                const sameCat = exp.categoryId ? all.filter(e => e.categoryId === exp.categoryId && e.status !== 'dropped') : [];
                const catDone = sameCat.length > 1 && sameCat.every(e => e.status === 'completed');
                const msg = MSGS[Math.floor(Math.random() * MSGS.length)];
                if (total === 1 || total % 5 === 0 || catDone) {
                  const cat = store.state.categories.find(c => c.id === exp.categoryId);
                  showFinale(total === 1 ? 'Your first dream, lived.' : catDone ? `All ${cat ? cat.name : ''} dreams done!` : `${total} dreams lived!`, msg);
                }
                showToast(msg, () => store.updateExperience(id, { status: 'want' }));
              }, 650);
            } else if (action === 'complete-direct') {
              uiState.openMenuId = null;
              store.updateExperience(id, { status: 'completed' });
              showToast(`Marked "${exp.title}" as completed`);
            } else if (action === 'restore') {
              store.updateExperience(id, { status: 'want' });
              showToast(`Restored "${exp.title}" to Want to Do`);
            } else if (action === 'drop') {
              uiState.openMenuId = null;
              store.updateExperience(id, { status: 'dropped' });
              showToast(`Moved "${exp.title}" to Dropped`, () => {
                store.updateExperience(id, { status: 'want' });
              });
            } else if (action === 'edit') {
              uiState.openMenuId = null;
              renderActiveSection();
              openExperienceModal(exp);
            } else if (action === 'toggle-menu') {
              uiState.openMenuId = uiState.openMenuId === id ? null : id;
              renderActiveSection();
            } else if (action === 'delete') {
              uiState.openMenuId = null;
              openConfirmModal({
                title: 'Delete Experience',
                message: `Are you sure you want to permanently delete "${exp.title}"? This cannot be undone.`,
                confirmText: 'Delete',
                onConfirm: () => {
                  store.deleteExperience(id);
                  showToast('Experience deleted');
                }
              });
            }
          });
        });
      }

            showToast('Backup imported successfully');
            renderApp();
          } catch (err) {
            console.error('Import error:', err);
            showToast('Invalid LIVIT JSON file. No existing data was overwritten.');

          deleteBtn.classList.remove('hidden');

          nameInput.value = '';
          descInput.value = '';
          catSelect.value = (uiState.selectedCategoryId !== 'all' && uiState.selectedCategoryId !== 'uncategorised')

          deleteBtn.classList.add('hidden');

        const acceptBtn = document.getElementById('confirm-accept-btn');
        const typeWrap = document.getElementById('confirm-type-wrap');
        const typeInput = document.getElementById('confirm-type-input');

        titleEl.textContent = title;
        msgEl.textContent = message;
        acceptBtn.textContent = confirmText;
        activeConfirmCallback = onConfirm;
        activeRequiredWord = requireTypedWord;

        if (requireTypedWord) {
          typeWrap.classList.remove('hidden');
          typeInput.value = '';
          acceptBtn.disabled = true;
          acceptBtn.style.opacity = '0.5';
        } else {
          typeWrap.classList.add('hidden');
          typeInput.value = '';
          acceptBtn.disabled = false;
          acceptBtn.style.opacity = '1';
        }

        modal.classList.remove('hidden');
        setTimeout(() => {
          if (requireTypedWord) typeInput.focus();
          else acceptBtn.focus();
        }, 40);
      }

      function closeConfirmModal() {
        document.getElementById('confirm-modal').classList.add('hidden');
        activeConfirmCallback = null;
        activeRequiredWord = null;
      }

      document.getElementById('confirm-type-input').addEventListener('input', (e) => {
        if (!activeRequiredWord) return;
        const acceptBtn = document.getElementById('confirm-accept-btn');
        const matches = e.target.value.trim().toUpperCase() === activeRequiredWord;
        acceptBtn.disabled = !matches;
        acceptBtn.style.opacity = matches ? '1' : '0.5';
      });

      document.getElementById('confirm-accept-btn').addEventListener('click', () => {
        if (activeRequiredWord) {
          const val = document.getElementById('confirm-type-input').value.trim().toUpperCase();
          if (val !== activeRequiredWord) return;
        }
        const cb = activeConfirmCallback;
        closeConfirmModal();
        if (typeof cb === 'function') cb();
      });

      document.getElementById('confirm-close-btn').addEventListener('click', closeConfirmModal);
      document.getElementById('confirm-cancel-btn').addEventListener('click', closeConfirmModal);
      document.getElementById('confirm-modal').addEventListener('click', (e) => {
        if (e.target.id === 'confirm-modal') closeConfirmModal();
      });

      /* ----------------------------------------------------------------------
         INITIALIZE APPLICATION
         ---------------------------------------------------------------------- */
      store.subscribe(() => {
        renderApp();
        if (!applyingCloudState && cloudUser && cloudReady) writeCloudState();
      });
      window.addEventListener('online', () => {
        if (cloudUser && cloudReady) writeCloudState();
      });
      renderApp();
    })();
  </script>
</body>
</html>
