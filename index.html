<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIVIT — Live the things you dream of</title>
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>try{var t=localStorage.getItem("livit_theme")||"ink",m=localStorage.getItem("livit_mode")||"light";if(m==="auto")m=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";var d=document.documentElement;d.setAttribute("data-theme",t);d.setAttribute("data-mode",m)}catch(e){}</script>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS — MONOCHROME FOUNDATION + FROST × SUNRISE ACCENTS
       ========================================================================== */
    :root {
      /* Light Theme (Warm editorial off-white, crisp white surfaces, deep ink) */
      --bg-canvas: #F7F6F3;
      --bg-sidebar: #F2F1ED;
      --bg-surface: #FFFFFF;
      --bg-surface-hover: #FCFBF9;
      --bg-subtle: #EFEDE8;
      --bg-glass: rgba(247, 246, 243, 0.85);
      --bg-overlay: rgba(20, 21, 24, 0.42);

      --border-hairline: #E5E4DF;
      --border-strong: #D3D1C9;

      --ink-primary: #141518;
      --ink-secondary: #5E626A;
      --ink-muted: #8A8E96;
      --ink-inverse: #FFFFFF;

      --btn-primary-bg: #141518;
      --btn-primary-hover: #27292F;
      --btn-primary-ink: #FFFFFF;

      /* Restrained Frost & Sunrise Accents */
      --frost-bg: #EAF1F8;
      --frost-border: #D2E1F0;
      --frost-ink: #356396;

      --sunrise-bg: #F8EFE6;
      --sunrise-border: #EDD8C4;
      --sunrise-ink: #A85D24;

      --silver-bg: #EFEFEF;
      --silver-border: #E0E0E0;
      --silver-ink: #4B4F56;

      --danger-bg: #FDF0EF;
      --danger-border: #F5D0CD;
      --danger-ink: #B8332A;

      --shadow-xs: 0 1px 2px rgba(20, 21, 24, 0.04);
      --shadow-sm: 0 2px 8px rgba(20, 21, 24, 0.05), 0 1px 2px rgba(20, 21, 24, 0.03);
      --shadow-md: 0 10px 28px rgba(20, 21, 24, 0.08), 0 2px 6px rgba(20, 21, 24, 0.04);
      --shadow-lg: 0 22px 50px rgba(20, 21, 24, 0.14), 0 4px 12px rgba(20, 21, 24, 0.06);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --radius-pill: 9999px;

      --sidebar-width: 248px;
      --transition-fast: 160ms cubic-bezier(0.22, 1, 0.36, 1);
      --transition-base: 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-mode="dark"] {
      /* Dark Theme (Near-black canvas, layered charcoal surfaces, controlled contrast) */
      --bg-canvas: #0D0E11;
      --bg-sidebar: #111317;
      --bg-surface: #16181E;
      --bg-surface-hover: #1C1F26;
      --bg-subtle: #1F222A;
      --bg-glass: rgba(17, 19, 23, 0.86);
      --bg-overlay: rgba(0, 0, 0, 0.68);

      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);

      --ink-primary: #F3F4F6;
      --ink-secondary: #989DA8;
      --ink-muted: #686D78;
      --ink-inverse: #111317;

      --btn-primary-bg: #F3F4F6;
      --btn-primary-hover: #FFFFFF;
      --btn-primary-ink: #111317;

      /* Restrained Dark Frost & Sunrise Accents */
      --frost-bg: rgba(124, 179, 240, 0.11);
      --frost-border: rgba(124, 179, 240, 0.22);
      --frost-ink: #8BC0F8;

      --sunrise-bg: rgba(224, 148, 88, 0.12);
      --sunrise-border: rgba(224, 148, 88, 0.24);
      --sunrise-ink: #E8A46D;

      --silver-bg: rgba(255, 255, 255, 0.06);
      --silver-border: rgba(255, 255, 255, 0.10);
      --silver-ink: #B4B8C2;

      --danger-bg: rgba(235, 87, 87, 0.12);
      --danger-border: rgba(235, 87, 87, 0.25);
      --danger-ink: #F27979;

      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.42);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    /* ==========================================================================
       2. RESET & BASE TYPOGRAPHY
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
      overflow-x: hidden;
      transition: background-color var(--transition-base), color var(--transition-base);
    }

    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--frost-ink);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .hidden {
      display: none !important;
    }

    /* ==========================================================================
       3. BRAND LOGO ADAPTIVE VISIBILITY
       ========================================================================== */
    .icon-for-light { display: block; }
    .icon-for-dark { display: none; }

    [data-theme="dark"] .icon-for-light { display: none; }
    [data-theme="dark"] .icon-for-dark { display: block; }

    /* ==========================================================================
       4. ONBOARDING VIEW
       ========================================================================== */
    .onboarding-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 20% 20%, var(--frost-bg) 0%, transparent 45%),
        radial-gradient(circle at 82% 80%, var(--sunrise-bg) 0%, transparent 45%),
        var(--bg-canvas);
    }

    .onboarding-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: fadeSlideUp 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .onboarding-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .onboarding-app-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
    }

    .onboarding-wordmark {
      height: 24px;
      width: auto;
    }

    .onboarding-title {
      font-size: 1.625rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.25;
      margin-bottom: 12px;
      color: var(--ink-primary);
    }

    .onboarding-subtitle {
      font-size: 0.9375rem;
      color: var(--ink-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .onboarding-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .onboarding-checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      font-size: 0.8125rem;
      color: var(--ink-secondary);
      cursor: pointer;
      user-select: none;
    }

    .onboarding-checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--ink-primary);
      cursor: pointer;
    }

    /* ==========================================================================
       5. APP SHELL LAYOUT (DESKTOP SIDEBAR + MOBILE TOP/BOTTOM NAV)
       ========================================================================== */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Desktop Left Sidebar (Day One editorial restraint) */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      transition: background-color var(--transition-base), border-color var(--transition-base);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 10px 24px 10px;
      border-bottom: 1px solid var(--border-hairline);
      margin-bottom: 20px;
    }

    .sidebar-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 8px;
      box-shadow: var(--shadow-xs);
    }

    .sidebar-wordmark {
      height: 18px;
      width: auto;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink-secondary);
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    .nav-item:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .nav-item.active {
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-weight: 600;
      box-shadow: var(--shadow-xs);
      border: 1px solid var(--border-hairline);
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .nav-badge {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ink-muted);
      background: var(--bg-subtle);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      min-width: 24px;
      text-align: center;
    }

    .nav-item.active .nav-badge {
      background: var(--frost-bg);
      color: var(--frost-ink);
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-hairline);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .theme-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink-secondary);
      background: transparent;
      border: 1px solid transparent;
      transition: all var(--transition-fast);
    }

    .theme-toggle-btn:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    /* Mobile Header & Bottom Bar */
    .mobile-header {
      display: none;
      position: sticky;
      top: 0;
      z-index: 25;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hairline);
      padding: 12px 16px;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-hairline);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
    }

    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      border-radius: var(--radius-sm);
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--ink-secondary);
      min-height: 48px;
      transition: color var(--transition-fast), background-color var(--transition-fast);
    }

    .mobile-nav-item.active {
      color: var(--ink-primary);
      font-weight: 600;
      background: var(--bg-subtle);
    }

    /* Main Content Area */
    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 44px 40px 80px;
      display: flex;
      justify-content: center;
      min-width: 0;
    }

    .main-container {
      width: 100%;
      max-width: 880px;
    }

    /* ==========================================================================
       6. SECTION HEADERS, BUTTONS & INPUTS
       ========================================================================== */
    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .greeting-eyebrow {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ink-secondary);
      margin-bottom: 4px;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--ink-primary);
    }

    .section-subtitle {
      font-size: 0.9rem;
      color: var(--ink-secondary);
      margin-top: 6px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.2;
      transition: all var(--transition-fast);
      white-space: nowrap;
      user-select: none;
    }

    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-ink);
      box-shadow: var(--shadow-xs);
    }

    .btn-primary:hover {
      background: var(--btn-primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--ink-primary);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-xs);
    }

    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .btn-ghost {
      color: var(--ink-secondary);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
    }

    .btn-ghost:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger-ink);
      border: 1px solid var(--danger-border);
    }

    .btn-danger:hover {
      filter: brightness(0.96);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.8125rem;
      border-radius: var(--radius-sm);
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-secondary);
      transition: all var(--transition-fast);
    }

    .btn-icon:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--ink-secondary);
    }

    .form-label span.req {
      color: var(--sunrise-ink);
      margin-left: 2px;
    }

    .input, .textarea, .select {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.9375rem;
      color: var(--ink-primary);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .input::placeholder, .textarea::placeholder {
      color: var(--ink-muted);
    }

    .input:hover, .textarea:hover, .select:hover {
      border-color: var(--border-strong);
    }

    .input:focus, .textarea:focus, .select:focus {
      outline: none;
      border-color: var(--frost-ink);
      box-shadow: 0 0 0 3px var(--frost-bg);
    }

    .textarea {
      resize: vertical;
      min-height: 84px;
      line-height: 1.5;
    }

    .form-error {
      font-size: 0.8rem;
      color: var(--danger-ink);
      margin-top: 2px;
    }

    /* ==========================================================================
       7. QUICK-ADD BAR, SEARCH & CATEGORY FILTER PILLS
       ========================================================================== */
    .quick-add-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 8px 10px 8px 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .quick-add-bar:focus-within {
      border-color: var(--frost-ink);
      box-shadow: 0 0 0 3px var(--frost-bg), var(--shadow-sm);
    }

    .quick-add-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.9375rem;
      color: var(--ink-primary);
      min-width: 0;
      padding: 6px 0;
    }

    .quick-add-input:focus {
      outline: none;
    }

    .quick-add-input::placeholder {
      color: var(--ink-muted);
    }

    .controls-toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--ink-muted);
      fill: none;
      stroke-width: 2;
      pointer-events: none;
    }

    .search-input {
      padding-left: 38px;
      padding-right: 36px;
      background: var(--bg-surface);
      height: 40px;
      font-size: 0.875rem;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      font-size: 0.75rem;
    }

    .search-clear:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .filter-pills-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filter-pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--ink-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      white-space: nowrap;
      transition: all var(--transition-fast);
    }

    .filter-pill:hover {
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .filter-pill.active {
      background: var(--ink-primary);
      color: var(--ink-inverse);
      border-color: var(--ink-primary);
    }

    /* ==========================================================================
       8. EXPERIENCE CARDS (MOMENTUM LAYERED POLISH + DAY ONE CLARITY)
       ========================================================================== */
    .experience-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exp-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      box-shadow: var(--shadow-xs);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast), opacity 260ms ease;
      position: relative;
    }

    .exp-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
      border-color: var(--border-strong);
    }

    .exp-card.completing {
      transform: scale(0.985);
      opacity: 0.35;
      border-color: var(--sunrise-border);
      background: var(--sunrise-bg);
    }

    .exp-card-body {
      flex: 1;
      min-width: 0;
    }

    .exp-meta-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .badge-frost {
      background: var(--frost-bg);
      color: var(--frost-ink);
      border: 1px solid var(--frost-border);
    }

    .badge-sunrise {
      background: var(--sunrise-bg);
      color: var(--sunrise-ink);
      border: 1px solid var(--sunrise-border);
    }

    .badge-silver {
      background: var(--silver-bg);
      color: var(--silver-ink);
      border: 1px solid var(--silver-border);
    }

    .exp-location {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--ink-secondary);
    }

    .exp-location svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .exp-date-meta {
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    .exp-title {
      font-size: 1.0625rem;
      font-weight: 600;
      color: var(--ink-primary);
      line-height: 1.38;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .exp-card.is-dropped .exp-title {
      color: var(--ink-secondary);
    }

    .exp-description {
      font-size: 0.8875rem;
      color: var(--ink-secondary);
      line-height: 1.55;
      margin-top: 4px;
      word-break: break-word;
    }

    .exp-notes-preview {
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      color: var(--ink-secondary);
      border-left: 2px solid var(--border-strong);
      word-break: break-word;
    }

    .exp-card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-complete {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: var(--radius-md);
      font-size: 0.8125rem;
      font-weight: 500;
      background: var(--bg-subtle);
      color: var(--ink-primary);
      border: 1px solid var(--border-hairline);
      transition: all var(--transition-fast);
    }

    .btn-complete:hover {
      background: var(--sunrise-bg);
      color: var(--sunrise-ink);
      border-color: var(--sunrise-border);
    }

    .btn-complete svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    /* Dropdown Menu */
    .dropdown-wrap {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 182px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 6px;
      z-index: 40;
      animation: fadeSlideUp 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.8375rem;
      font-weight: 500;
      color: var(--ink-primary);
      text-align: left;
      transition: background-color var(--transition-fast);
    }

    .dropdown-item:hover {
      background: var(--bg-subtle);
    }

    .dropdown-item.danger {
      color: var(--danger-ink);
    }

    .dropdown-item.danger:hover {
      background: var(--danger-bg);
    }

    /* ==========================================================================
       9. EMPTY STATES
       ========================================================================== */
    .empty-state {
      background: var(--bg-surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 56px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .empty-state-icon {
      width: 52px;
      height: 52px;
      margin-bottom: 18px;
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
    }

    .empty-state-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 6px;
      letter-spacing: -0.015em;
    }

    .empty-state-text {
      font-size: 0.9rem;
      color: var(--ink-secondary);
      max-width: 360px;
      margin-bottom: 22px;
      line-height: 1.55;
    }

    /* ==========================================================================
       10. CATEGORIES SECTION
       ========================================================================== */
    .category-create-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .category-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-xs);
      transition: all var(--transition-fast);
    }

    .category-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    .category-card-main {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .category-card-name {
      font-size: 0.9625rem;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-card-count {
      font-size: 0.8125rem;
      color: var(--ink-secondary);
    }

    .category-card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ==========================================================================
       11. SETTINGS SECTION
       ========================================================================== */
    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .settings-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-xs);
    }

    .settings-card-header {
      margin-bottom: 16px;
    }

    .settings-card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 4px;
    }

    .settings-card-desc {
      font-size: 0.85rem;
      color: var(--ink-secondary);
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .theme-segmented {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-hairline);
    }

    .theme-seg-btn {
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink-secondary);
      transition: all var(--transition-fast);
    }

    .theme-seg-btn.active {
      background: var(--bg-surface);
      color: var(--ink-primary);
      box-shadow: var(--shadow-xs);
    }

    .brand-about-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-about-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* ==========================================================================
       12. MODALS & TOAST NOTIFICATIONS
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      animation: fadeIn 160ms ease;
    }

    .modal-dialog {
      width: 100%;
      max-width: 500px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeSlideUp 220ms cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
    }

    .modal-dialog.modal-sm {
      max-width: 410px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .modal-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--ink-primary);
      letter-spacing: -0.015em;
    }

    .modal-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border-hairline);
      background: var(--bg-subtle);
    }

    .modal-footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    /* Toast Container */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: var(--ink-primary);
      color: var(--ink-inverse);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeSlideUp 220ms cubic-bezier(0.22, 1, 0.36, 1);
      max-width: 360px;
    }

    .toast-undo-btn {
      color: var(--sunrise-ink);
      background: var(--bg-surface);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ==========================================================================
       13. RESPONSIVE BREAKPOINTS
       ========================================================================== */
    @media (max-width: 767px) {
      .sidebar {
        display: none;
      }

      .mobile-header {
        display: flex;
      }

      .mobile-nav {
        display: grid;
      }

      .main-wrapper {
        margin-left: 0;
        padding: 24px 16px 96px;
      }

      .section-title {
        font-size: 1.5rem;
      }

      .exp-card {
        flex-direction: column;
        padding: 16px 18px;
        gap: 14px;
      }

      .exp-card-actions {
        width: 100%;
        justify-content: flex-end;
        padding-top: 10px;
        border-top: 1px solid var(--border-hairline);
      }

      .toast-container {
        bottom: 76px;
        left: 16px;
        right: 16px;
        align-items: center;
      }

      .toast {
        width: 100%;
        max-width: none;
        justify-content: space-between;
      }

      .onboarding-card {
        padding: 32px 22px;
      }
    }

    /* ===== V1.1 ADDITIONS: themes, checkbox, celebration, smoothness ===== */
    [data-mode="dark"] .icon-for-light { display: none; }
    [data-mode="dark"] .icon-for-dark { display: block; }
    [data-theme="midnight"] { --bg-canvas:#0A0F1E; --bg-sidebar:#0D1426; --bg-surface:#121A31; --bg-surface-hover:#172140; --bg-subtle:#1A2444; --bg-glass:rgba(10,15,30,.86); --border-hairline:rgba(140,170,255,.12); --border-strong:rgba(140,170,255,.24); --ink-primary:#EAF0FF; --ink-secondary:#9AA7C7; --ink-muted:#6B7799; --ink-inverse:#0A0F1E; --btn-primary-bg:#EAF0FF; --btn-primary-hover:#FFFFFF; --btn-primary-ink:#0A0F1E; }
    [data-theme="forest"] { --bg-canvas:#0B120E; --bg-sidebar:#0E1712; --bg-surface:#131E17; --bg-surface-hover:#19271F; --bg-subtle:#1D2B22; --bg-glass:rgba(11,18,14,.86); --border-hairline:rgba(150,220,170,.11); --border-strong:rgba(150,220,170,.22); --ink-primary:#EAF5EC; --ink-secondary:#9BB3A1; --ink-muted:#6B8272; --ink-inverse:#0B120E; --btn-primary-bg:#D8F3DC; --btn-primary-hover:#FFFFFF; --btn-primary-ink:#0B120E; }
    [data-theme="ocean"] { --bg-canvas:#F0F6FA; --bg-sidebar:#E8F0F6; --bg-surface:#FFFFFF; --bg-surface-hover:#F7FBFD; --bg-subtle:#E3EDF4; --bg-glass:rgba(240,246,250,.85); --border-hairline:#D8E4EC; --border-strong:#C3D3DE; --ink-primary:#0F1E2B; --ink-secondary:#546677; --ink-muted:#8296A6; --btn-primary-bg:#0F3B5C; --btn-primary-hover:#14507C; --btn-primary-ink:#FFFFFF; }
    [data-theme="rose"] { --bg-canvas:#FBF4F4; --bg-sidebar:#F6ECEC; --bg-surface:#FFFFFF; --bg-surface-hover:#FFFAFA; --bg-subtle:#F3E6E6; --bg-glass:rgba(251,244,244,.85); --border-hairline:#EEDCDC; --border-strong:#E0C5C5; --ink-primary:#2A1618; --ink-secondary:#745559; --ink-muted:#9C8083; --btn-primary-bg:#7A1F3D; --btn-primary-hover:#962A4D; --btn-primary-ink:#FFFFFF; }
    html { scroll-behavior: smooth; }
    html.theming *, html.theming *::before, html.theming *::after { transition: background-color .4s ease, color .4s ease, border-color .4s ease, box-shadow .4s ease !important; }
    .btn:active, .btn-complete:active, .filter-pill:active { transform: scale(.97); }
    @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } }
    .experience-list.animate .exp-card { animation: cardIn .5s cubic-bezier(.22,1,.36,1) both; }
    .experience-list.animate .exp-card:nth-child(2){animation-delay:45ms}
    .experience-list.animate .exp-card:nth-child(3){animation-delay:90ms}
    .experience-list.animate .exp-card:nth-child(4){animation-delay:135ms}
    .experience-list.animate .exp-card:nth-child(5){animation-delay:180ms}
    .experience-list.animate .exp-card:nth-child(6){animation-delay:225ms}
    .experience-list.animate .exp-card:nth-child(7){animation-delay:270ms}
    .experience-list.animate .exp-card:nth-child(8){animation-delay:315ms}
    .exp-check { --check-color: #0EA5E9; flex: none; width: 28px; height: 28px; margin-top: 2px; border-radius: 9px; border: 2px solid color-mix(in srgb, var(--check-color) 58%, transparent); background: color-mix(in srgb, var(--check-color) 10%, var(--bg-surface)); display: grid; place-items: center; transition: all var(--transition-fast); box-shadow: 0 2px 7px color-mix(in srgb, var(--check-color) 12%, transparent); }
    .exp-check:hover { border-color: var(--check-color); background: color-mix(in srgb, var(--check-color) 18%, var(--bg-surface)); transform: scale(1.08); }
    .exp-check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s .08s; }
    .exp-check.on, .exp-card.completing .exp-check { background: var(--check-color); border-color: var(--check-color); box-shadow: 0 3px 12px color-mix(in srgb, var(--check-color) 34%, transparent); }
    .exp-check.on svg, .exp-card.completing .exp-check svg { stroke-dashoffset: 0; }
    .exp-card.completing .exp-check { animation: chkPop .45s; }
    @keyframes chkPop { 40% { transform: scale(1.3); } }
    .exp-card.completing { opacity: 1; transform: scale(1.01); animation: cardGlow 1s ease-out; }
    @keyframes cardGlow { 0% { box-shadow: 0 0 0 0 var(--sunrise-ink); } 40% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--sunrise-ink) 28%, transparent), 0 0 34px color-mix(in srgb, var(--sunrise-ink) 45%, transparent); } 100% { box-shadow: none; } }
    .category-color-control { display:flex; align-items:center; gap:12px; color:var(--ink-secondary); font-size:.82rem; }
    .category-color-control input[type="color"] { width:48px; height:38px; padding:3px; border:1px solid var(--border-strong); border-radius:10px; background:var(--bg-surface); cursor:pointer; }
    .fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
    .fx-finale { position: fixed; inset: 0; z-index: 9998; display: grid; place-items: center; text-align: center; padding: 24px; background: rgba(8,9,12,.8); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity .4s; }
    .fx-finale.show { opacity: 1; pointer-events: auto; }
    .fx-finale h2 { font-size: clamp(34px, 8vw, 72px); font-weight: 700; letter-spacing: -.03em; color: #fff; transform: scale(.8); opacity: 0; transition: all .6s cubic-bezier(.22,1.4,.36,1); }
    .fx-finale.show h2 { transform: none; opacity: 1; }
    .fx-finale p { color: #c9ccd3; margin-top: 12px; }
    .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
    .theme-swatch { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); background: var(--bg-surface); font-size: .8rem; font-weight: 500; color: var(--ink-secondary); transition: all var(--transition-fast); }
    .theme-swatch:hover { transform: translateY(-2px); border-color: var(--border-strong); }
    .theme-swatch.active { border-color: var(--ink-primary); color: var(--ink-primary); box-shadow: var(--shadow-sm); }
    .theme-swatch .sw { display: flex; width: 100%; height: 34px; border-radius: 8px; padding: 6px; gap: 4px; align-items: flex-end; border: 1px solid rgba(128,128,128,.25); }
    .theme-swatch .sw i { flex: 1; height: 100%; border-radius: 4px; }
  
    #livit-cloud-status[data-state="synced"] { color: #16a34a !important; }
    #livit-cloud-status[data-state="saving"],
    #livit-cloud-status[data-state="connecting"] { color: var(--accent, var(--ink-secondary)) !important; }
    #livit-cloud-status[data-state="error"] { color: #dc2626 !important; }
    .livit-account-line { display:flex; flex-direction:column; gap:2px; }
    .livit-account-line span { font-size:.82rem; color:var(--ink-secondary); }

  </style>

<body>
  <!-- ========================================================================
       REUSABLE EXACT SVG BRAND DEFINITIONS (LIVIT WORDMARK + DARK/LIGHT ICONS)
       ======================================================================== -->
  <svg width="0" height="0" style="position:absolute;visibility:hidden;" aria-hidden="true">
    <defs>
      <!-- LIVIT Exact Wordmark: Geometric L I V(with nested summit chevron) I T -->
      <symbol id="livit-wordmark" viewBox="0 0 264 56">
        <!-- L -->
        <path d="M8 6 H19 V40 H44 V50 H8 Z" fill="currentColor" />
        <!-- I -->
        <path d="M58 6 H69 V50 H58 Z" fill="currentColor" />
        <!-- V outer -->
        <path d="M84 6 H96.5 L118 40.5 L139.5 6 H152 L123.5 50 H112.5 Z" fill="currentColor" />
        <!-- V nested inverted-V / summit chevron (apex aligned with top cap-height y=6) -->
        <path d="M118 6 L131 26.5 L123.5 31.2 L118 22.2 L112.5 31.2 L105 26.5 Z" fill="currentColor" />
        <!-- I -->
        <path d="M167 6 H178 V50 H167 Z" fill="currentColor" />
        <!-- T -->
        <path d="M193 6 H256 V16 H230 V50 H219 V16 H193 Z" fill="currentColor" />
      </symbol>

      <!-- LIVIT Dark App Icon: Deep charcoal squircle with white broken circle, 3 peaks & summit flag -->
      <symbol id="livit-icon-dark" viewBox="0 0 120 120">
        <rect x="2" y="2" width="116" height="116" rx="28" fill="#121316" />
        <!-- Broken circle arc (open at top for flag & right pennant) -->
        <path d="M 55.5 23.3 A 37 37 0 1 0 77.5 27.5" fill="none" stroke="#FFFFFF" stroke-width="6.2" stroke-linecap="butt" />
        <!-- Three-peaked mountain range rising cleanly from lower-left and lower-right circle arcs -->
        <path d="M 28.5 79 L 42 57 L 48.5 65.5 L 60 44.5 L 71.5 65.5 L 78 57 L 91.5 79" fill="none" stroke="#FFFFFF" stroke-width="6.2" stroke-linecap="butt" stroke-linejoin="miter" />
        <!-- Vertical flagpole & triangular summit flag at central apex -->
        <path d="M 60 46 V 20 L 82 28.5 L 60 36.5" fill="#FFFFFF" />
        <rect x="57.2" y="20" width="5.6" height="27" fill="#FFFFFF" />
      </symbol>

      <!-- LIVIT Light App Icon: Crisp white squircle with dark #141518 broken circle, 3 peaks & summit flag -->
      <symbol id="livit-icon-light" viewBox="0 0 120 120">
        <rect x="2" y="2" width="116" height="116" rx="28" fill="#FFFFFF" stroke="#E5E4DF" stroke-width="2" />
        <!-- Broken circle arc -->
        <path d="M 55.5 23.3 A 37 37 0 1 0 77.5 27.5" fill="none" stroke="#141518" stroke-width="6.2" stroke-linecap="butt" />
        <!-- Three-peaked mountain range -->
        <path d="M 28.5 79 L 42 57 L 48.5 65.5 L 60 44.5 L 71.5 65.5 L 78 57 L 91.5 79" fill="none" stroke="#141518" stroke-width="6.2" stroke-linecap="butt" stroke-linejoin="miter" />
        <!-- Vertical flagpole & triangular summit flag -->
        <path d="M 60 46 V 20 L 82 28.5 L 60 36.5" fill="#141518" />
        <rect x="57.2" y="20" width="5.6" height="27" fill="#141518" />
      </symbol>
    </defs>
  </svg>

  <!-- ========================================================================
       1. FIRST-TIME ONBOARDING SCREEN
       ======================================================================== -->
  <section id="onboarding-view" class="onboarding-screen hidden" aria-label="Welcome to LIVIT">
    <div class="onboarding-card">
      <div class="onboarding-brand">
        <svg class="onboarding-app-icon icon-for-light" aria-hidden="true"><use href="#livit-icon-light" /></svg>
        <svg class="onboarding-app-icon icon-for-dark" aria-hidden="true"><use href="#livit-icon-dark" /></svg>
        <svg class="onboarding-wordmark" role="img" aria-label="LIVIT"><use href="#livit-wordmark" /></svg>
      </div>

      <h1 class="onboarding-title">Live the things you dream of.</h1>
      <p class="onboarding-subtitle">
        Save the experiences you want to have, enjoy them at your own pace, and keep track of the things you've done.
      </p>

      <form id="onboarding-form" class="onboarding-form" novalidate>
        <div class="form-group">
          <label for="onboarding-name-input" class="form-label">What should we call you?</label>
          <input
            id="onboarding-name-input"
            type="text"
            class="input"
            placeholder="Your first name"
            maxlength="40"
            autocomplete="given-name"
            required
          />
          <div id="onboarding-error" class="form-error hidden"></div>
        </div>

        <label class="onboarding-checkbox-row">
          <input id="onboarding-seed-checkbox" type="checkbox" />

  <!-- ========================================================================
       6. APPLICATION JAVASCRIPT — CLEAN ARCHITECTURE & PERSISTENT STORE
       ======================================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getAuth, initializeAuth, indexedDBLocalPersistence, GoogleAuthProvider,
      signInWithPopup, signInWithCredential, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    (function () {
      'use strict';

      /* ----------------------------------------------------------------------
         CONSTANTS & DEFAULT DATA
         ---------------------------------------------------------------------- */
      const STORAGE_KEYS = {
        DATA: 'livit_app_data_v1',
        THEME: 'livit_theme'
      };

      const BUILT_IN_CATEGORIES = [
        { id: 'cat_travel', name: 'Travel', tone: 'frost', builtIn: true },
        { id: 'cat_adventure', name: 'Adventure', tone: 'sunrise', builtIn: true },
        { id: 'cat_food', name: 'Food', tone: 'sunrise', builtIn: true },
        { id: 'cat_skills', name: 'Skills', tone: 'frost', builtIn: true },
        { id: 'cat_experiences', name: 'Experiences', tone: 'silver', builtIn: true },
        { id: 'cat_personal', name: 'Personal', tone: 'silver', builtIn: true }
      ];

      const SEED_EXPERIENCES = [
        {
          id: 'exp_seed_1',
          title: 'Watch the Northern Lights from a glass cabin',
          description: 'Spend a quiet winter night beneath the aurora borealis far from city lights.',
          categoryId: 'cat_travel',
          location: 'Tromsø, Norway',
          notes: 'Best window is late autumn through early spring.',
          status: 'want',
          createdAt: new Date(Date.now() - 86400000 * 4).toISOString(),
          completedAt: null
        },
        {
          id: 'exp_seed_2',
          title: 'Learn to make handmade ramen noodles from scratch',
          description: 'Master alkaline dough hydration, broth depth, and tare balance.',
          categoryId: 'cat_food',
          location: 'Home Kitchen',
          notes: '',
          status: 'want',
          createdAt: new Date(Date.now() - 86400000 * 3).toISOString(),
          completedAt: null
        },
        {
          id: 'exp_seed_3',
          title: 'Hike the Milford Track at sunrise',
          description: 'Walk through temperate rainforests, suspension bridges, and alpine passes.',
          categoryId: 'cat_adventure',
          location: 'Fiordland, New Zealand',
          notes: 'Book huts well ahead of season.',
          status: 'want',
          createdAt: new Date(Date.now() - 86400000 * 2).toISOString(),
          completedAt: null
        }
      ];

      /* ----------------------------------------------------------------------
         MODULAR PERSISTENCE STORE (Adapter-ready for future Firebase sync)
         ---------------------------------------------------------------------- */
      class LivitStore {
        constructor() {
          this.state = this.load();
          this.listeners = new Set();
        }

        getDefaultState() {
          return {
            version: 1,
            profile: null, // { name: string, createdAt: string }
            categories: JSON.parse(JSON.stringify(BUILT_IN_CATEGORIES)),
            experiences: []
          };
        }

        load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.DATA);
            if (!raw) return this.getDefaultState();
            const parsed = JSON.parse(raw);
            return this.validateAndNormalize(parsed);
          } catch (err) {
            console.error('Failed to read LIVIT state from localStorage:', err);
            return this.getDefaultState();
          }
        }

        validateAndNormalize(data) {
          if (!data || typeof data !== 'object') {
            throw new Error('Invalid data format.');
          }

          const normalized = this.getDefaultState();

          // Profile validation
          if (data.profile && typeof data.profile === 'object' && typeof data.profile.name === 'string' && data.profile.name.trim()) {
            normalized.profile = {
              name: data.profile.name.trim().slice(0, 40),
              createdAt: typeof data.profile.createdAt === 'string' ? data.profile.createdAt : new Date().toISOString()
            };
          }

          // Categories validation
          if (Array.isArray(data.categories)) {
            const seenIds = new Set();
            const validCats = [];
            for (const c of data.categories) {
              if (c && typeof c.id === 'string' && typeof c.name === 'string' && c.name.trim() && !seenIds.has(c.id)) {
                seenIds.add(c.id);
                validCats.push({
                  id: c.id,
                  name: c.name.trim().slice(0, 32),
                  tone: ['frost', 'sunrise', 'silver'].includes(c.tone) ? c.tone : 'silver',
                  color: /^#[0-9a-fA-F]{6}$/.test(c.color || '') ? c.color : null,
                  builtIn: Boolean(c.builtIn)
                });
              }
            }
            normalized.categories = validCats;
          }

          const categoryIds = new Set(normalized.categories.map(c => c.id));

          // Experiences validation
          if (Array.isArray(data.experiences)) {
            const seenExpIds = new Set();
            const validExps = [];
            for (const e of data.experiences) {
              if (!e || typeof e.title !== 'string' || !e.title.trim()) continue;
              const id = typeof e.id === 'string' && e.id ? e.id : generateId('exp');
              if (seenExpIds.has(id)) continue;
              seenExpIds.add(id);

              const status = ['want', 'completed', 'dropped'].includes(e.status) ? e.status : 'want';
              const categoryId = typeof e.categoryId === 'string' && categoryIds.has(e.categoryId) ? e.categoryId : null;

              validExps.push({
                id,
                title: e.title.trim().slice(0, 140),
                description: typeof e.description === 'string' ? e.description.trim().slice(0, 600) : '',
                categoryId,
                location: typeof e.location === 'string' ? e.location.trim().slice(0, 100) : '',
                notes: typeof e.notes === 'string' ? e.notes.trim().slice(0, 800) : '',
                status,
                createdAt: typeof e.createdAt === 'string' ? e.createdAt : new Date().toISOString(),
                completedAt: status === 'completed'
                  ? (typeof e.completedAt === 'string' ? e.completedAt : new Date().toISOString())
                  : null
              });
            }
            normalized.experiences = validExps;
          }

          return normalized;
        }

        save() {
          try {
            localStorage.setItem(STORAGE_KEYS.DATA, JSON.stringify(this.state));
          } catch (err) {
            console.error('Failed to save LIVIT state:', err);
            showToast('Unable to save changes locally. Check storage permissions.');
          }
          this.notify();
        }

        subscribe(fn) {
          this.listeners.add(fn);
        }

        notify() {
          this.listeners.forEach(fn => fn(this.state));
        }

        /* Profile Methods */
        setProfileName(name, withSeeds = false) {
          const clean = String(name || '').trim().slice(0, 40);
          if (!clean) return false;
          const isFirstTime = !this.state.profile;
          this.state.profile = {
            name: clean,
            createdAt: this.state.profile?.createdAt || new Date().toISOString()
          };
          if (isFirstTime && withSeeds && this.state.experiences.length === 0) {
            this.state.experiences = JSON.parse(JSON.stringify(SEED_EXPERIENCES));
          }
          this.save();
          return true;
        }

        /* Experience CRUD */
        addExperience({ title, description = '', categoryId = null, location = '', notes = '' }) {
          const cleanTitle = String(title || '').trim().slice(0, 140);
          if (!cleanTitle) return null;

          const validCat = this.state.categories.some(c => c.id === categoryId) ? categoryId : null;
          const newExp = {
            id: generateId('exp'),
            title: cleanTitle,
            description: String(description || '').trim().slice(0, 600),
            categoryId: validCat,
            location: String(location || '').trim().slice(0, 100),
            notes: String(notes || '').trim().slice(0, 800),
            status: 'want',
            createdAt: new Date().toISOString(),
            completedAt: null
          };

          this.state.experiences.unshift(newExp);
          this.save();
          return newExp;
        }

        updateExperience(id, updates) {
          const idx = this.state.experiences.findIndex(e => e.id === id);
          if (idx === -1) return null;
          const current = this.state.experiences[idx];

          const cleanTitle = updates.title !== undefined
            ? String(updates.title).trim().slice(0, 140)
            : current.title;
          if (!cleanTitle) return null;

          const validCat = updates.categoryId !== undefined
            ? (this.state.categories.some(c => c.id === updates.categoryId) ? updates.categoryId : null)
            : current.categoryId;

          const nextStatus = updates.status && ['want', 'completed', 'dropped'].includes(updates.status)
            ? updates.status
            : current.status;

          let nextCompletedAt = current.completedAt;
          if (nextStatus === 'completed' && current.status !== 'completed') {
            nextCompletedAt = new Date().toISOString();
          } else if (nextStatus !== 'completed') {
            nextCompletedAt = null;
          }

          this.state.experiences[idx] = {
            ...current,
            title: cleanTitle,
            description: updates.description !== undefined ? String(updates.description).trim().slice(0, 600) : current.description,
            categoryId: validCat,
            location: updates.location !== undefined ? String(updates.location).trim().slice(0, 100) : current.location,
            notes: updates.notes !== undefined ? String(updates.notes).trim().slice(0, 800) : current.notes,
            status: nextStatus,
            completedAt: nextCompletedAt
          };

          this.save();
          return this.state.experiences[idx];
        }

        deleteExperience(id) {
          const before = this.state.experiences.length;
          this.state.experiences = this.state.experiences.filter(e => e.id !== id);
          if (this.state.experiences.length !== before) {
            this.save();
            return true;
          }
          return false;
        }

        /* Category CRUD */
        addCategory(name) {
          const clean = String(name || '').trim().slice(0, 32);
          if (!clean) return { ok: false, error: 'Category name cannot be empty.' };
          const duplicate = this.state.categories.some(c => c.name.toLowerCase() === clean.toLowerCase());
          if (duplicate) return { ok: false, error: 'A category with this name already exists.' };

          const tones = ['frost', 'sunrise', 'silver'];
          const colors = ['#8B5CF6','#0EA5E9','#F97316','#10B981','#EC4899','#EAB308','#6366F1','#14B8A6','#EF4444','#A855F7','#84CC16','#F43F5E'];
          const tone = tones[this.state.categories.length % tones.length];
          const newCat = {
            id: generateId('cat'),
            name: clean,
            tone,
            color: colors[this.state.categories.length % colors.length],
            builtIn: false
          };
          this.state.categories.push(newCat);
          this.save();
          return { ok: true, category: newCat };
        }

        renameCategory(id, newName) {
          const clean = String(newName || '').trim().slice(0, 32);
          if (!clean) return { ok: false, error: 'Category name cannot be empty.' };
          const duplicate = this.state.categories.some(c => c.id !== id && c.name.toLowerCase() === clean.toLowerCase());
          if (duplicate) return { ok: false, error: 'Another category already uses that name.' };

          const cat = this.state.categories.find(c => c.id === id);
          if (!cat) return { ok: false, error: 'Category not found.' };
          cat.name = clean;
          this.save();
          return { ok: true };
        }

        setCategoryColor(id, color) {
          if (!/^#[0-9a-fA-F]{6}$/.test(String(color || ''))) return { ok: false, error: 'Choose a valid colour.' };
          const cat = this.state.categories.find(c => c.id === id);
          if (!cat) return { ok: false, error: 'Category not found.' };
          cat.color = color;
          this.save();
          return { ok: true };
        }

        deleteCategory(id) {
          const exists = this.state.categories.some(c => c.id === id);
          if (!exists) return false;
          this.state.categories = this.state.categories.filter(c => c.id !== id);
          // Preserve all experiences; convert deleted category references to uncategorised (null)
          this.state.experiences = this.state.experiences.map(exp =>
            exp.categoryId === id ? { ...exp, categoryId: null } : exp
          );
          this.save();
          return true;
        }

        /* Export / Import / Reset */
        exportJSON() {
          return JSON.stringify({
            app: 'LIVIT',
            exportedAt: new Date().toISOString(),
            ...this.state
          }, null, 2);
        }

        importJSON(rawString) {
          const parsed = JSON.parse(rawString);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || !Array.isArray(parsed.experiences)) {
            throw new Error('Not a LIVIT backup file.');
          }
          const validated = this.validateAndNormalize(parsed);
          if (!validated.profile && this.state.profile) {
            validated.profile = this.state.profile;
          }
          this.state = validated;
          this.save();
        }

        clearAllData() {
          localStorage.removeItem(STORAGE_KEYS.DATA);
          this.state = this.getDefaultState();
          this.notify();
        }
      }

      function showToast(message, undoCallback = null) {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = 'toast';

        const msgSpan = document.createElement('span');
        msgSpan.textContent = message;
        toast.appendChild(msgSpan);

        if (typeof undoCallback === 'function') {
          const undoBtn = document.createElement('button');
          undoBtn.type = 'button';
          undoBtn.className = 'toast-undo-btn';
          undoBtn.textContent = 'Undo';
          undoBtn.addEventListener('click', () => {
            undoCallback();
            toast.remove();
          });
          toast.appendChild(undoBtn);
        }

        while (container.children.length >= 3) container.firstChild.remove();
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(6px)';
          toast.style.transition = 'all 180ms ease';
          setTimeout(() => toast.remove(), 200);
        }, 3800);

      const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let fxCanvas = null, fxCtx = null, fxParts = [], fxRun = false, audioCtx = null, finaleEl = null, finaleTimer = null;

      function fxInit() {
        if (fxCanvas) return;
        fxCanvas = document.createElement('canvas');
        fxCanvas.className = 'fx-canvas';
        document.body.appendChild(fxCanvas);
        fxCtx = fxCanvas.getContext('2d');
        const size = () => { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; };
        size();
        window.addEventListener('resize', size);
      }

      function fxBurst(x, y, n) {
        if (!FX.on || reduceMotion()) return;
        fxInit();
        const cols = ['#7CB3F0', '#E8A46D', '#F472B6', '#34D399', '#FACC15', '#A78BFA'];
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * (n > 60 ? 11 : 6);
          fxParts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 4 + Math.random() * 5, c: cols[i % cols.length], r: Math.random() * 6, l: 1 });
        }
        if (!fxRun) { fxRun = true; requestAnimationFrame(fxTick); }
      }

      function fxTick() {
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        fxParts = fxParts.filter(p => p.l > 0);
        for (const p of fxParts) {
          p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.vx *= 0.99; p.r += 0.2; p.l -= 0.012;
          fxCtx.save();
          fxCtx.globalAlpha = Math.max(p.l, 0);
          fxCtx.translate(p.x, p.y);
          fxCtx.rotate(p.r);
          fxCtx.fillStyle = p.c;
          fxCtx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6);
          fxCtx.restore();
        }
        if (fxParts.length) requestAnimationFrame(fxTick);
        else { fxRun = false; fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); }
      }

      function fxChime(big) {
        if (!FX.on) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          (big ? [523, 659, 784, 1047] : [659, 880]).forEach((f, i) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.value = f;
            o.connect(g); g.connect(audioCtx.destination);
            const t = audioCtx.currentTime + i * 0.1;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.12, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
            o.start(t); o.stop(t + 0.65);
          });
        } catch (e) { /* audio unavailable */ }
      }
